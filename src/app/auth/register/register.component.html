<section class="register-page">
      <div class="register-container">
        <form [formGroup]="form" (ngSubmit)="onRegister()" >
            <h3>Register an account</h3>
            <div id="liner"></div>
            <p id="top-message">Welcome back! Please enter your details</p>
            <div class="form-container">
                <div class="form-group input1">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="24px" fill="#b0825f"><path d="M560-680v-80h320v80H560Zm0 160v-80h320v80H560Zm0 160v-80h320v80H560Zm-240-40q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35ZM80-160v-76q0-21 10-40t28-30q45-27 95.5-40.5T320-360q56 0 106.5 13.5T522-306q18 11 28 30t10 40v76H80Zm86-80h308q-35-20-74-30t-80-10q-41 0-80 10t-74 30Zm154-240q17 0 28.5-11.5T360-520q0-17-11.5-28.5T320-560q-17 0-28.5 11.5T280-520q0 17 11.5 28.5T320-480Zm0-40Zm0 280Z"/></svg>
                    </div>
                    <input  type="text" id="name" class="form-control" placeholder="Name"required name="name">
                     <!-- <div *ngIf="usernameField.invalid && usernameField.touched" class="error">
                      Username is required.
                     </div>  -->
                </div>

                <div class="form-group input2">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="24px" fill="#b0825f"><path d="M560-680v-80h320v80H560Zm0 160v-80h320v80H560Zm0 160v-80h320v80H560Zm-240-40q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35ZM80-160v-76q0-21 10-40t28-30q45-27 95.5-40.5T320-360q56 0 106.5 13.5T522-306q18 11 28 30t10 40v76H80Zm86-80h308q-35-20-74-30t-80-10q-41 0-80 10t-74 30Zm154-240q17 0 28.5-11.5T360-520q0-17-11.5-28.5T320-560q-17 0-28.5 11.5T280-520q0 17 11.5 28.5T320-480Zm0-40Zm0 280Z"/></svg>
                    </div>
                    <input  type="text" id="surname" class="form-control" placeholder="Surname"required name="surname">
                     <!-- <div *ngIf="usernameField.invalid && usernameField.touched" class="error">
                      Username is required.
                     </div>  -->
                </div>

                <div class="form-group input3">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="24px" fill="#b0825f"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>
                    </div>
                    <input  type="email" id="email" class="form-control" placeholder="Email"required name="email">
                     <!-- <div *ngIf="usernameField.invalid && usernameField.touched" class="error">
                      Username is required.
                     </div>  -->
                </div>

                <div class="form-group input4">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="24px" fill="#b0825f"><path d="M798-120q-125 0-247-54.5T329-329Q229-429 174.5-551T120-798q0-18 12-30t30-12h162q14 0 25 9.5t13 22.5l26 140q2 16-1 27t-11 19l-97 98q20 37 47.5 71.5T387-386q31 31 65 57.5t72 48.5l94-94q9-9 23.5-13.5T670-390l138 28q14 4 23 14.5t9 23.5v162q0 18-12 30t-30 12ZM241-600l66-66-17-94h-89q5 41 14 81t26 79Zm358 358q39 17 79.5 27t81.5 13v-88l-94-19-67 67ZM241-600Zm358 358Z"/></svg>
                    </div>
                    <input  type="tel" id="phone" class="form-control" placeholder="Phone"required name="phone">
                     <!-- <div *ngIf="usernameField.invalid && usernameField.touched" class="error">
                      Username is required.
                     </div>  -->
                </div>

                <div class="form-group input5">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="24px" fill="#b0825f"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg>
                    </div>
                    <input  type="password" id="password" class="form-control" placeholder="Password"required name="password">
                     <!-- <div *ngIf="usernameField.invalid && usernameField.touched" class="error">
                      Username is required.
                     </div>  -->
                </div>

                <div class="form-group input6">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="24px" fill="#BF9C7D"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg>
                    </div>
                    <input  type="password" id="password2" class="form-control" placeholder="Confirm Password"required name="password2">
                     <!-- <div *ngIf="usernameField.invalid && usernameField.touched" class="error">
                      Username is required.
                     </div>  -->
                </div>
                <div class="form-group input7">
                    
                    <label class="material-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        <a href="">Terms and Conditions</a>
                    </label>
                </div>
                <div class="form-group input8">
                    
                    <div class="full-width-button">
                        <app-button 
                            link="/register-page"  
                            buttonText="Register"
                            hoverBackgroundColor="#bf9c7d"
                            width="100%"
                        ></app-button>
                    </div>
                </div>

            </div>

        </form>
        
        <div class="login-block">
            <p>Already Have an Account?</p> 
            <a [routerLink]="['/login-page']" id="register">Login</a>          
          </div>
      </div>
      
</section>
