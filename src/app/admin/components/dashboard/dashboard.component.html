<div class="dashboard-section">
    
    <div class="side-nav">
        <button class="logout" (click)="onLogout()">Log Out |</button>
        <div class="user-info">
            <div class="image-box">
                <img src="../../../../../assets/icons/user(1).png" alt="" srcset="">
            </div>       
            <p>{{userName}}</p> <p>{{userSurname}}</p>
        </div>
        <app-side-nav 
            [items]="dashboardItems" 
            [showSearch]="false"
             (categorySelected)="onCategorySelected($event)" 
        />
        
    </div>
    <div class="main">
        <ng-container [ngSwitch]="selectedCategory">
    
            <!-- Gift Section -->
            <app-dash-gifts  *ngSwitchCase="'Gifts'" />
            
            <!-- Tools Section -->
            <app-dash-tools *ngSwitchCase="'Tools'" />

            <!-- Leaders Section -->
            <app-dash-leaders *ngSwitchCase="'Leaders'" />

            <!-- Users Section -->
            <app-dash-users *ngSwitchCase="'Users'" />
            
            <!-- Default or fallback content -->
            <p *ngSwitchDefault>Select a category to view details.</p>
            
          </ng-container>
    </div>
</div>
