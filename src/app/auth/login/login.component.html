<section class="login-page">
  <div class="login-container bg-slate-500">
    <form [formGroup]="form" (ngSubmit)="onLoginSubmit()">
      <h3>Sign In</h3>
      <div id="liner"></div>
      <p id="top-message">Welcome back! Please enter your details</p>

      <!-- Email Input -->
      <div class="form-group">
        <div class="icon-container">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="35px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#b0825f"
          >
            <path
              d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"
            />
          </svg>
        </div>
        <input
          type="email"
          formControlName="email"
          id="email"
          class="form-control"
          placeholder="Email"
          required
          name="email"
        />
        <div class="error-feedback" *ngIf="hasDisplayError('email')">
          {{ getErrorMessage('email') }}
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="icon-container">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="35px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#b0825f"
          >
            <path
              d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"
            />
          </svg>
        </div>
        <input
          type="password"
          formControlName="password"
          placeholder="Password"
          id="password"
          class="form-control"
          required
          name="password"
        />
        <div class="error-feedback" *ngIf="hasDisplayError('password')">
          {{ getErrorMessage('password') }}
        </div>
      </div>

      <a href="" id="forgot-password">Forgot Password?</a>
      <br />
      <div class="full-width-button">
        <app-button
            [isSubmit]="false"  
            buttonText="Login"
            hoverBackgroundColor="#bf9c7d"
            width="100%"
            (buttonClicked)="onLoginSubmit()"  >
        </app-button>
      </div>

      <div class="register-block">
        <p>Don't have an account?</p>
        <a [routerLink]="['/register-page']" id="register">Register</a>
      </div>
    </form>
  </div>
  <app-loading-indicator></app-loading-indicator>
</section>
